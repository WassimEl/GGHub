<style>
:root{
  --bg:#efedf5; --panel:#fbfaff; --ink:#1a1625; --muted:#625b75; --line:#d9d4e6;
  --accent:#7c3aed; --accent-ink:#fff; --warn:#c2410c; --tile:#14202e; --tile-ink:#e8ecf0;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141414;--panel:#1d1d21;--ink:#f1eefb;--muted:#9a94ad;--line:#2d2b36;--accent:#8b5cf6;--accent-ink:#fff;--warn:#fb923c;--tile:#e6edf3;--tile-ink:#0f1720}
}
:root[data-theme="dark"]{--bg:#141414;--panel:#1d1d21;--ink:#f1eefb;--muted:#9a94ad;--line:#2d2b36;--accent:#8b5cf6;--accent-ink:#fff;--warn:#fb923c;--tile:#e6edf3;--tile-ink:#0f1720}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Public Sans",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:28px 18px 64px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
h1{font:800 clamp(2.2rem,6vw,3.6rem)/1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.03em;margin:0}
h1 small{display:block;font:500 1rem/1.4 "Public Sans",sans-serif;letter-spacing:0;color:var(--muted);margin-top:8px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:72px;height:72px;border-radius:16px;flex:none}
.bar{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;background:transparent;padding:6px 9px;color:var(--muted);font-weight:500;font-size:.88rem}
button.ghost:hover{color:var(--ink);background:var(--bg)}
button.danger.armed{color:var(--warn);font-weight:700}
.search{flex:1 1 220px;min-width:180px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr));gap:18px}
section.cat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.cat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cat-head h2{font:800 1.25rem/1.2 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-.01em}
.cat-head span.n{color:var(--muted);font-weight:500;font-size:.9rem;margin-left:6px}
ul{list-style:none;margin:0;padding:0}
li.row{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
li.row a.link{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:10px 4px}
li.row a.link:hover .t{color:var(--accent)}
.tile{flex:none;width:36px;height:36px;border-radius:9px;color:#fff;display:grid;place-items:center}
.tile svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.txt{min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:12px 4px 4px;border-top:1px solid var(--line);font-size:.95rem}
.tarifs{margin-top:18px}
.twrap{overflow-x:auto}
.tarifs table{width:100%;border-collapse:collapse}
.tarifs th{text-align:left;color:var(--muted);font-size:.85rem;font-weight:600;padding:4px 4px 6px}
.tarifs td{padding:10px 4px;border-top:1px solid var(--line)}
.tarifs th:nth-child(n+2),.tarifs td:nth-child(n+2){text-align:right;white-space:nowrap}
.tarifs td.tp{font-weight:700;font-variant-numeric:tabular-nums}
.tarifs td.tact button+button{margin-left:4px}
.tarifs button.ghost.edit{color:var(--accent)}
.tarifs td input{padding:7px 9px}
.tarifs td input[type=number]{width:110px;text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;margin:0 0 20px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:10px 16px;color:var(--muted);font-weight:600;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.kbar{height:8px;background:var(--bg);border-radius:99px;overflow:hidden;margin:4px 0 10px}
.kfill{height:100%;width:0;background:var(--accent)}
li.krow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.klab{flex:1;display:flex;align-items:center;gap:12px;padding:12px 4px;cursor:pointer;margin:0;font-weight:500;font-size:1rem}
.klab input{width:22px;height:22px;flex:none;accent-color:var(--accent);padding:0;border:0;background:transparent}
li.krow.on .klab span{color:var(--muted);text-decoration:line-through}
.kdone{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;background:var(--bg);border:1px solid var(--accent);border-radius:10px;padding:12px;margin-top:10px;font-weight:600}
.kform{display:flex;gap:8px;margin-top:12px}
.kfoot{display:flex;justify-content:flex-end;margin-top:6px}
.stock{margin-top:18px}
.sform{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin:6px 0 4px}
.sundo{min-height:1.5em;color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:6px}
li.srow{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line);padding:6px 4px}
li.srow.shead{border-top:0;color:var(--muted);font-size:.85rem;padding-bottom:0}
.srow .sn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sp,.srow .sq{color:var(--muted)}
.srow .sq{display:flex;align-items:center;gap:6px}
.srow .sq.low{color:var(--warn);font-weight:700}
.srow .sq.low .qn{color:var(--warn)}
.qn{min-width:2.2ch;text-align:center;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
button.step{width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:1.15rem;line-height:1;border-radius:8px}
button.step:disabled{opacity:.4;cursor:default}
.srow button.ghost{color:var(--warn)}
.srow button.ghost.edit{color:var(--accent)}
.sact{display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.sedit input{padding:7px 9px}
@media (max-width:560px){.sform{grid-template-columns:1fr 1fr}.sform #sName,.sform button{grid-column:1/-1}li.srow{grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px}li.srow.sedit{grid-template-columns:1fr 1fr}li.sedit input:first-child,.sedit .sact{grid-column:1/-1}}
.none{text-align:center;color:var(--muted);padding:40px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:22px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(10,16,24,.55)}
dialog h3{font:800 1.3rem "Bricolage Grotesque",sans-serif;margin:0 0 14px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
.act{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
textarea{width:100%;min-height:120px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;font:.82rem/1.4 ui-monospace,monospace;color:inherit}
footer{margin-top:30px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:.88rem}
.msg{margin-left:auto}
@media (prefers-reduced-motion:no-preference){button{transition:background .15s,color .15s}}
</style>
</head>

function guess(l){var s=((l.title||"")+" "+(l.url||"")).toLowerCase();var m=[["instagram","camera"],["discord","chat"],["tally","form"],["form","form"],["spreadsheets","table"],["sheet","table"],["track","box"],["suivi","box"],["devis","receipt"],["pcpartpicker","cpu"],["buildcores","cube"],["canva","design"],["userdiag","diag"],["diag","diag"],["shop","cart"],["boutique","cart"]];for(var i=0;i<m.length;i++)if(s.indexOf(m[i][0])>-1)return m[i][1];return "link"}
function colorOf(l){if(HEX.test(l.color||""))return l.color;var h=0,s=l.title||"";for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return PAL[h%PAL.length]}
function tileFor(l){var d=el("div","tile");var k=ICONS[l.icon]?l.icon:guess(l);d.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k]+'</svg>';d.style.background=colorOf(l);return d}
var editLink=null,editCat=null;

function render(){
  var q=$("q").value.trim().toLowerCase(),g=$("grid");g.textContent="";var shown=0;
  S.cats.forEach(function(c){
    var links=c.links.filter(function(l){return !q||(l.title+" "+l.url+" "+c.name).toLowerCase().indexOf(q)>-1});
    if(q&&!links.length)return;
    shown++;
    var sec=el("section","cat"),head=el("div","cat-head"),h=el("h2",null,c.name);
    h.appendChild(el("span","n",String(c.links.length)));
    var tools=el("div");
    var a=el("button","ghost","Ajouter");a.onclick=function(){openLink(null,c.id)};
    var r=el("button","ghost","Renommer");r.onclick=function(){openCat(c)};
    var d=el("button","ghost danger","Supprimer");arm(d,"Confirmer",function(){S.cats=S.cats.filter(function(x){return x.id!==c.id});save();render()});
    tools.append(a,r,d);head.append(h,tools);sec.appendChild(head);
    if(!links.length){sec.appendChild(el("div","empty","Aucun lien ici pour l'instant."))}
    var ul=el("ul");
    links.forEach(function(l){
      var li=el("li","row"),an=el("a","link");
      if(safe(l.url)){an.href=l.url;an.target="_blank";an.rel="noopener noreferrer"}
      an.appendChild(tileFor(l));
      var tx=el("div","txt");tx.append(el("div","t",l.title),el("div","h",host(l.url)));an.appendChild(tx);
      var e=el("button","ghost","Modifier");e.onclick=function(){openLink(l,c.id)};
      var x=el("button","ghost danger","Retirer");arm(x,"Confirmer",function(){c.links=c.links.filter(function(y){return y.id!==l.id});save();render()});
      li.append(an,e,x);ul.appendChild(li);
    });
    sec.appendChild(ul);g.appendChild(sec);
  });
  $("none").hidden=!(q&&!shown);
}

function fillCats(sel){var s=$("lCat");s.textContent="";S.cats.forEach(function(c){var o=el("option",null,c.name);o.value=c.id;s.appendChild(o)});if(sel)s.value=sel}
function openLink(l,catId){
  if(!S.cats.length){flash("Crée d'abord une catégorie.");return}
  editLink=l?{id:l.id,from:catId}:null;
  $("dLinkT").textContent=l?"Modifier le lien":"Ajouter un lien";
  fillCats(catId||S.cats[0].id);
  $("lTitle").value=l?l.title:"";$("lUrl").value=l?l.url:"";
  var is=$("lIcon");if(!is.options.length){Object.keys(ILABEL).forEach(function(k){var o=el("option",null,ILABEL[k]);o.value=k;is.appendChild(o)})}
  is.value=l&&ILABEL[l.icon]?l.icon:"auto";
  $("lColor").value=l?colorOf(l):PAL[S.cats.reduce(function(n,c){return n+c.links.length},0)%PAL.length];
  $("dLink").showModal();$("lTitle").focus();
}
$("addLink").onclick=function(){openLink(null,null)};
$("lCancel").onclick=function(){$("dLink").close()};
$("fLink").addEventListener("submit",function(){
  var title=$("lTitle").value.trim(),url=norm($("lUrl").value),cid=$("lCat").value;
  if(!title||!$("lUrl").value.trim())return;
  if(!safe(url)){flash("L'adresse doit commencer par http ou https.");return}
  if(editLink){S.cats.forEach(function(c){c.links=c.links.filter(function(y){return y.id!==editLink.id})})}
  var dest=S.cats.filter(function(c){return c.id===cid})[0];
  dest.links.push({id:editLink?editLink.id:uid(),title:title,url:url,icon:$("lIcon").value,color:$("lColor").value});
  save();$("dLink").close();render();
});

function openCat(c){editCat=c||null;$("dCatT").textContent=c?"Renommer la catégorie":"Nouvelle catégorie";$("cName").value=c?c.name:"";$("dCat").showModal();$("cName").focus()}
$("addCat").onclick=function(){openCat(null)};
$("cCancel").onclick=function(){$("dCat").close()};
$("fCat").addEventListener("submit",function(){
  var n=$("cName").value.trim();if(!n)return;
  if(editCat)editCat.name=n;else S.cats.push({id:uid(),name:n,links:[]});
  save();$("dCat").close();render();
});

$("q").addEventListener("input",render);

$("exp").onclick=function(){
  var t=JSON.stringify(Object.assign({},S,{stock:STK,tarifs:TAR,check:KI}));
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){flash("Sauvegarde copiée.")},function(){flash("Copie impossible sur ce navigateur.")})}
  else flash("Copie impossible sur ce navigateur.");
};
$("imp").onclick=function(){$("impTxt").value="";$("dImp").showModal()};
$("iCancel").onclick=function(){$("dImp").close()};
$("iOk").onclick=function(){
  try{var d=JSON.parse($("impTxt").value);if(!d||!Array.isArray(d.cats))throw 0;
    d.cats.forEach(function(c){c.id=c.id||uid();c.name=String(c.name||"Sans nom");c.links=(c.links||[]).filter(function(l){return l&&safe(String(l.url))}).map(function(l){return{id:l.id||uid(),title:String(l.title||""),url:String(l.url),icon:ICONS[l.icon]?l.icon:"auto",color:HEX.test(l.color||"")?l.color:""}})});
    if(Array.isArray(d.stock)){STK=d.stock.filter(function(x){return x&&x.name&&isFinite(x.price)&&isFinite(x.qty)}).map(function(x){return{id:x.id||uid(),name:String(x.name),price:+x.price,qty:Math.max(0,Math.floor(+x.qty))}});saveS();renderStock()}
    if(Array.isArray(d.tarifs)&&d.tarifs.length){TAR=d.tarifs.filter(function(x){return x&&x.name&&isFinite(x.price)}).map(function(x){return{id:x.id||uid(),name:String(x.name),price:+x.price}});if(!TAR.length)TAR=JSON.parse(JSON.stringify(TDEF));saveT();renderTarifs()}
    if(Array.isArray(d.check)&&d.check.length){KI=d.check.filter(function(x){return x&&x.text}).map(function(x){return{id:x.id||uid(),text:String(x.text)}});if(!KI.length)KI=kDefaults();saveK();KCHK={};renderCheck()}
    delete d.stock;delete d.tarifs;delete d.check;S=d;save();$("dImp").close();render();flash("Sauvegarde restaurée.");
  }catch(e){flash("Texte de sauvegarde invalide.")}
};

var TDEF=[{id:"t1",name:"Montage",price:70},{id:"t2",name:"Nettoyage (pâte thermique & poussière)",price:40},{id:"t3",name:"Nettoyage + Recâblage",price:75},{id:"t4",name:"Dépannage",price:15}];
var TAR=null;
try{var rt=localStorage.getItem("ggbuild-tarifs-v1");TAR=rt?JSON.parse(rt):null}catch(e){TAR=null}
if(!Array.isArray(TAR)||!TAR.length)TAR=JSON.parse(JSON.stringify(TDEF));
function saveT(){try{localStorage.setItem("ggbuild-tarifs-v1",JSON.stringify(TAR))}catch(e){}}
var tEdit=null;
var eur0=new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:2});
function tMsg(t){$("tMsg").textContent=t||""}
function renderTarifs(){
  var tb=$("tBody");tb.textContent="";
  TAR.forEach(function(r){
    var tr=document.createElement("tr"),c1=el("td"),c2=el("td","tp"),c3=el("td","tact");
    if(tEdit===r.id){
      var n=el("input");n.value=r.name;n.maxLength=80;n.setAttribute("aria-label","Prestation");
      var p=el("input");p.type="number";p.min="0";p.step="0.01";p.value=String(r.price);p.setAttribute("aria-label","Prix en euros");
      var commit=function(){
        var name=n.value.trim(),price=parseFloat(String(p.value).replace(",","."));
        if(!name||isNaN(price)||price<0){tMsg("Remplis la prestation et un prix valide.");return}
        r.name=name;r.price=price;tEdit=null;saveT();tMsg("");renderTarifs();
      };
      var cancel=function(){tEdit=null;tMsg("");renderTarifs()};
      [n,p].forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();commit()}else if(e.key==="Escape"){cancel()}})});
      var ok=el("button","primary","Enregistrer");ok.type="button";ok.onclick=commit;
      var no=el("button","ghost","Annuler");no.type="button";no.onclick=cancel;
      c1.appendChild(n);c2.appendChild(p);c3.append(ok,no);
      setTimeout(function(){p.focus();p.select()},0);
    }else{
      c1.textContent=r.name;c2.textContent=eur0.format(r.price);
      var b=el("button","ghost edit","Modifier");b.type="button";b.setAttribute("aria-label","Modifier "+r.name);
      b.onclick=function(){tEdit=r.id;tMsg("");renderTarifs()};c3.appendChild(b);
    }
    tr.append(c1,c2,c3);tb.appendChild(tr);
  });
}
arm($("tReset"),"Confirmer",function(){
  var b=$("tReset");delete b.dataset.armed;b.classList.remove("armed");b.textContent="Prix par défaut";
  TAR=JSON.parse(JSON.stringify(TDEF));tEdit=null;saveT();tMsg("");renderTarifs();
});
var KDEF=["Le PC démarre et passe le POST sans erreur","BIOS à jour et réglages vérifiés (XMP/EXPO activé, TPM, bon disque de démarrage)","Windows activé et à jour","Pilotes installés (carte graphique, chipset, réseau, audio)","RAM reconnue avec la bonne capacité et la bonne vitesse","Tous les disques sont détectés","Températures CPU et GPU vérifiées en charge","Test de stabilité lancé (CPU, RAM, GPU)","Ventilateurs et watercooling : sens du flux correct et bruit normal","Écran réglé à la bonne fréquence (Hz) dans Windows","Éclairage RGB configuré si demandé","Câblage propre, aucun câble ne gêne un ventilateur","Panneaux, vis et filtres à poussière bien fermés","Accessoires remis au client (câbles, vis de rechange, notice de la carte mère)"];
function kDefaults(){return KDEF.map(function(t,i){return{id:"k"+(i+1),text:t}})}
var KI=null;
try{var rk=localStorage.getItem("ggbuild-check-v1");KI=rk?JSON.parse(rk):null}catch(e){KI=null}
if(!Array.isArray(KI)||!KI.length)KI=kDefaults();
var KCHK={};
function saveK(){try{localStorage.setItem("ggbuild-check-v1",JSON.stringify(KI))}catch(e){}}
function updateK(){
  var done=KI.filter(function(x){return KCHK[x.id]}).length;
  $("kN").textContent=done+"/"+KI.length;
  $("kFill").style.width=(KI.length?Math.round(done/KI.length*100):0)+"%";
  $("kDone").hidden=!(KI.length&&done===KI.length);
}
function renderCheck(){
  var ul=$("kList");ul.textContent="";
  KI.forEach(function(it){
    var on=!!KCHK[it.id];
    var li=el("li","krow"+(on?" on":""));
    var lab=el("label","klab");var cb=document.createElement("input");cb.type="checkbox";cb.checked=on;
    cb.onchange=function(){KCHK[it.id]=cb.checked;li.classList.toggle("on",cb.checked);updateK()};
    lab.append(cb,el("span",null,it.text));
    var d=el("button","ghost","Retirer");d.type="button";d.setAttribute("aria-label","Retirer ce point de la liste : "+it.text);
    arm(d,"Confirmer",function(){KI=KI.filter(function(x){return x.id!==it.id});delete KCHK[it.id];saveK();renderCheck()});
    li.append(lab,d);ul.appendChild(li);
  });
  updateK();
}
function kClear(){KCHK={};renderCheck()}
$("kReset").onclick=kClear;
$("kFinish").onclick=function(){kClear();window.scrollTo(0,0)};
$("kForm").addEventListener("submit",function(e){
  e.preventDefault();var t=$("kNew").value.trim();if(!t)return;
  KI.push({id:uid(),text:t});saveK();$("kNew").value="";renderCheck();$("kNew").focus();
});
arm($("kDefault"),"Confirmer",function(){
  var b=$("kDefault");delete b.dataset.armed;b.classList.remove("armed");b.textContent="Liste par défaut";
  KI=kDefaults();KCHK={};saveK();renderCheck();
});
function showTab(name){
  var chk=name==="check";
  $("pLinks").hidden=chk;$("pCheck").hidden=!chk;$("bar").hidden=chk;
  $("tabLinks").setAttribute("aria-selected",String(!chk));$("tabCheck").setAttribute("aria-selected",String(chk));
  try{history.replaceState(null,"",chk?"#checklist":location.pathname+location.search)}catch(e){}
}
$("tabLinks").onclick=function(){showTab("links")};
$("tabCheck").onclick=function(){showTab("check")};
var STK=[];
try{var rs=localStorage.getItem("ggbuild-stock-v1");STK=rs?JSON.parse(rs):[]}catch(e){STK=[]}
if(!Array.isArray(STK))STK=[];
function saveS(){try{localStorage.setItem("ggbuild-stock-v1",JSON.stringify(STK))}catch(e){}}
var eur=new Intl.NumberFormat("fr-BE",{style:"currency",currency:"EUR"});
var lastDel=null,undoT;
function sMsg(t){var u=$("sUndo");u.textContent=t||""}
var editId=null;
function editRow(it){
  var li=el("li","srow sedit");
  var n=el("input");n.value=it.name;n.maxLength=80;n.setAttribute("aria-label","Nom");
  var p=el("input");p.type="number";p.min="0";p.step="0.01";p.value=String(it.price);p.setAttribute("aria-label","Prix en euros");
  var q=el("input");q.type="number";q.min="0";q.step="1";q.value=String(it.qty);q.setAttribute("aria-label","Quantité en stock");
  function commit(){
    var name=n.value.trim(),price=parseFloat(String(p.value).replace(",",".")),qty=parseInt(q.value,10);
    if(!name||isNaN(price)||price<0||isNaN(qty)||qty<0){sMsg("Remplis le nom, un prix et un stock valides.");return}
    it.name=name;it.price=price;it.qty=qty;editId=null;saveS();sMsg("");renderStock();
  }
  function cancel(){editId=null;sMsg("");renderStock()}
  [n,p,q].forEach(function(x){x.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();commit()}else if(e.key==="Escape"){cancel()}})});
  var ok=el("button","primary","Enregistrer");ok.type="button";ok.onclick=commit;
  var no=el("button","ghost","Annuler");no.type="button";no.onclick=cancel;
  var act=el("div","sact");act.append(ok,no);
  li.append(n,p,q,act);
  setTimeout(function(){n.focus()},0);
  return li;
}
function renderStock(){
  var ul=$("sList");ul.textContent="";var total=0,units=0;
  if(!STK.length){ul.appendChild(el("li","empty","Aucun article en stock. Ajoute le premier avec le formulaire ci-dessus."))}
  else{var hd=el("li","srow shead");hd.append(el("div",null,"Nom"),el("div",null,"Prix"),el("div",null,"Stock"),el("div",null,""));ul.appendChild(hd)}
  STK.forEach(function(it,i){
    total+=it.price*it.qty;units+=it.qty;
    if(editId===it.id){ul.appendChild(editRow(it));return}
    var li=el("li","srow");
    var qc=el("div","sq"+(it.qty===0?" low":""));
    var step=function(dq,k){return function(){it.qty=Math.max(0,it.qty+dq);saveS();renderStock();var t=document.querySelector('[data-k="'+it.id+k+'"]');if(!t||t.disabled)t=document.querySelector('[data-k="'+it.id+'p"]');if(t)t.focus()}};
    var mb=el("button","step","\u2212");mb.type="button";mb.dataset.k=it.id+"m";mb.disabled=it.qty===0;mb.setAttribute("aria-label","Retirer une unité de "+it.name);mb.onclick=step(-1,"m");
    var pb=el("button","step","+");pb.type="button";pb.dataset.k=it.id+"p";pb.setAttribute("aria-label","Ajouter une unité à "+it.name);pb.onclick=step(1,"p");
    qc.append(mb,el("span","qn",String(it.qty)),pb);
    li.append(el("div","sn",it.name),el("div","sp",eur.format(it.price)),qc);
    var d=el("button","ghost","Supprimer");d.type="button";d.setAttribute("aria-label","Supprimer "+it.name);
    d.onclick=function(){
      lastDel={it:it,i:i};STK.splice(i,1);saveS();renderStock();
      var u=$("sUndo");u.textContent="« "+it.name+" » supprimé. ";
      var b=el("button","ghost","Annuler");b.type="button";
      b.onclick=function(){if(lastDel){STK.splice(Math.min(lastDel.i,STK.length),0,lastDel.it);lastDel=null;saveS();renderStock();sMsg("")}};
      u.appendChild(b);clearTimeout(undoT);undoT=setTimeout(function(){sMsg("");lastDel=null},7000);
    };
    var e=el("button","ghost edit","Modifier");e.type="button";e.setAttribute("aria-label","Modifier "+it.name);e.onclick=function(){editId=it.id;sMsg("");renderStock()};
    var act=el("div","sact");act.append(e,d);li.appendChild(act);ul.appendChild(li);
  });
  $("sN").textContent=String(STK.length);
  $("sSum").textContent=STK.length?units+" unités · valeur "+eur.format(total):"";
}
$("sForm").addEventListener("submit",function(e){
  e.preventDefault();
  var name=$("sName").value.trim(),price=parseFloat(String($("sPrice").value).replace(",",".")),qty=parseInt($("sQty").value,10);
  if(!name||isNaN(price)||price<0||isNaN(qty)||qty<0){sMsg("Remplis le nom, un prix et un stock valides.");return}
  STK.push({id:uid(),name:name,price:price,qty:qty});saveS();renderStock();sMsg("");
  $("sName").value="";$("sPrice").value="";$("sQty").value="";$("sName").focus();
});
render();renderStock();renderTarifs();renderCheck();
if(location.hash==="#checklist")showTab("check");
})();
</script>
</body>
